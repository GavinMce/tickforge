live config v1
# The Standard plan streams EQUS.MINI: consolidated top of book, with no status (halts, limit-up/limit-down) and no
# trades-with-consolidated-quote schema. `tbbo` is each trade with the best bid and offer at that moment, about eight million
# records a day; `mbp-1` (every change) is about forty times that.
dataset EQUS.MINI
subscribe tbbo ALL_SYMBOLS
key_env DATABENTO_API_KEY
# The strategy set and its universe are in the ConfigMap; everything that is written is on the live volume.
set /config/month.set
snapshots /data/live/snapshots
certificates /data/live/certificates.txt
dir /data/live/run
# The day ends at 20:00 New York time, the close of after-hours trading.
