      - id: E18-S04
        jira: TIC-143
        title: "Shared Tier 1 capacity: refcounted pins, priority, denial counters"
        status: done
        deps: [E18-S03]
        evidence: >
          tf-engine claims (ADR 0044). Holds (`pin`) are now counted per strategy (the old single flag
          let one strategy's unpin release another's; tests show both strategies pinning one symbol and
          one letting go leave it pinned). A symbol with any hold is never demoted by the sweep nor
          evicted. `request` asks for a symbol to be in Tier 1: already there (interest recorded),
