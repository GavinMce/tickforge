# tickforge backlog: epics (large bodies of work) and the stories inside them
# (actionable, each independently reviewable and testable).
#
# This file is the source of truth; Jira mirrors it.
#   - `id`      stable local id (E<epic>-S<story>); never reused.
#   - `status`  todo | done. `done` means the acceptance criteria are met and
#               covered by tests in the repo (see `evidence`).
#   - `deps`    local ids that must land first.
#   - `jira`    issue key, written back once the item exists in Jira.
# Near-term epics (E01-E06) are detailed; later ones are deliberately coarse
# and get refined when the preceding phase has taught us something.

jira:
  site: arb-it-test.atlassian.net
  project: TIC
  board: https://arb-it-test.atlassian.net/jira/software/projects/TIC/boards/2/backlog
  epic_type: Epic
  story_type: Story

epics:
  # ---------------------------------------------------------------- Phase 1
  - id: E01
    jira: TIC-1
    title: Foundations and canonical data model
    phase: 1
    labels: [phase1, core]
    goal: One small, fast, stable event model and the project scaffolding everything else builds on.
    stories:
      - id: E01-S01
        jira: TIC-2
        title: Cargo workspace, pinned toolchain, lints and Taskfile
        status: done
        evidence: Cargo.toml, rust-toolchain.toml, Taskfile.yml; `task check` is green
        ac:
          - Workspace builds with edition 2024; unsafe code forbidden workspace-wide
          - "`task check` runs fmt, clippy -D warnings and tests"
      - id: E01-S02
        jira: TIC-17
        title: Canonical Event model (Trade, Quote, Status) with fixed-point prices
        status: done
        evidence: crates/tf-core/src/{event,px}.rs
        ac:
          - Event is Copy and at most 64 bytes (compile-time assertion)
          - Px is i64 at 1e-9 (Databento scale); floats only via explicit from_f64
          - Status covers halt, resume, LULD band and SSR
      - id: E01-S03
        jira: TIC-18
        title: Clock abstraction (SystemClock, monotonic SimClock)
        status: done
        evidence: crates/tf-core/src/clock.rs
        ac:
          - SimClock never moves backwards
          - Engine-facing code takes a Clock; documented rule against direct wall-clock use
      - id: E01-S04
        jira: TIC-19
        title: Stable little-endian binary encoding with decode and FNV-1a hash
        status: done
        evidence: crates/tf-core/src/{encode,hash}.rs
        ac:
          - Encode/decode round-trips every event kind back to back
          - Truncated and corrupt input return errors, never panic
          - Encoded sizes are pinned by a test
      - id: E01-S05
        jira: TIC-20
        title: CI pipeline (GitHub Actions)
        status: done
        evidence: .github/workflows/ci.yml (job `check`, 23-27 s); `check` is a required status on main
        ac:
          - Runs fmt, clippy -D warnings and tests on every PR
          - Cargo cache configured; runs in under 5 minutes
          - Required check on the main branch
      - id: E01-S06
        jira: TIC-21
        title: Persistent security master (stable instrument ids)
        status: done
        evidence: crates/tf-secmaster/ (Builder, SecurityMaster, Session, text format); docs/adr/0005-security-master-identity.md
        deps: [E01-S02]
        ac:
          - Ids stable across days, ticker changes and corporate actions
          - Maps provider-native ids (Databento instrument_id, Alpaca symbol) to InstrumentId
          - Loaded at startup into a dense array for hot-path lookups
      - id: E01-S07
        jira: TIC-22
        title: Event model v2 (corrections, cancel-errors, news, schema versioning)
        status: done
        evidence: crates/tf-core/src/{event,encode}.rs; v1 tape fixture generated by the pre-change encoder decodes as v1 (test a_v1_tape_from_the_old_encoder_still_decodes)
        deps: [E01-S02]
        ac:
          - Correction and cancel-error events modelled (Alpaca corrections/cancelErrors)
          - NewsEvent with arrival timestamp for point-in-time use
          - Encoding carries a schema version; old tapes still decode
      - id: E01-S08
        jira: TIC-23
        title: ADR process and contributor docs
        status: done
        evidence: docs/adr/ (template, index, ADRs 0001-0004); README workflow section
        ac:
          - docs/adr/ with a template and the first ADRs (language, no Redis on hot path, determinism rules)
          - README workflow section matches how Jira keys are used in branches and commits

