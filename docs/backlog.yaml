# tickforge backlog: epics (large bodies of work) and the stories inside them
# (actionable, each independently reviewable and testable).
#
# This file is the source of truth; Jira mirrors it.
#   - `id`      stable local id (E<epic>-S<story>); never reused.
#   - `status`  todo | done. `done` means the acceptance criteria are met and
#               covered by tests in the repo (see `evidence`).
#   - `deps`    local ids that must land first.
#   - `jira`    issue key, written back once the item exists in Jira.
# Near-term epics (E01-E06) are detailed; later ones are deliberately coarse
# and get refined when the preceding phase has taught us something.

jira:
  site: arb-it-test.atlassian.net
  project: TIC
  board: https://arb-it-test.atlassian.net/jira/software/projects/TIC/boards/2/backlog
  epic_type: Epic
  story_type: Story

epics:
  # ---------------------------------------------------------------- Phase 1
  - id: E01
    jira: TIC-1
    title: Foundations and canonical data model
    phase: 1
    labels: [phase1, core]
    goal: One small, fast, stable event model and the project scaffolding everything else builds on.
    stories:
      - id: E01-S01
        jira: TIC-2
        title: Cargo workspace, pinned toolchain, lints and Taskfile
        status: done
        evidence: Cargo.toml, rust-toolchain.toml, Taskfile.yml; `task check` is green
        ac:
          - Workspace builds with edition 2024; unsafe code forbidden workspace-wide
          - "`task check` runs fmt, clippy -D warnings and tests"
      - id: E01-S02
        jira: TIC-17
        title: Canonical Event model (Trade, Quote, Status) with fixed-point prices
        status: done
        evidence: crates/tf-core/src/{event,px}.rs
        ac:
          - Event is Copy and at most 64 bytes (compile-time assertion)
          - Px is i64 at 1e-9 (Databento scale); floats only via explicit from_f64
          - Status covers halt, resume, LULD band and SSR
      - id: E01-S03
        jira: TIC-18
        title: Clock abstraction (SystemClock, monotonic SimClock)
        status: done
        evidence: crates/tf-core/src/clock.rs
        ac:
          - SimClock never moves backwards
          - Engine-facing code takes a Clock; documented rule against direct wall-clock use
      - id: E01-S04
        jira: TIC-19
        title: Stable little-endian binary encoding with decode and FNV-1a hash
        status: done
        evidence: crates/tf-core/src/{encode,hash}.rs
        ac:
          - Encode/decode round-trips every event kind back to back
          - Truncated and corrupt input return errors, never panic
          - Encoded sizes are pinned by a test
      - id: E01-S05
        jira: TIC-20
        title: CI pipeline (GitHub Actions)
        status: done
        evidence: .github/workflows/ci.yml (job `check`, 23-27 s); `check` is a required status on main
        ac:
          - Runs fmt, clippy -D warnings and tests on every PR
          - Cargo cache configured; runs in under 5 minutes
          - Required check on the main branch
      - id: E01-S06
        jira: TIC-21
        title: Persistent security master (stable instrument ids)
        status: done
        evidence: crates/tf-secmaster/ (Builder, SecurityMaster, Session, text format); docs/adr/0005-security-master-identity.md
        deps: [E01-S02]
        ac:
          - Ids stable across days, ticker changes and corporate actions
          - Maps provider-native ids (Databento instrument_id, Alpaca symbol) to InstrumentId
          - Loaded at startup into a dense array for hot-path lookups
      - id: E01-S07
        jira: TIC-22
        title: Event model v2 (corrections, cancel-errors, news, schema versioning)
        status: done
        evidence: crates/tf-core/src/{event,encode}.rs; v1 tape fixture generated by the pre-change encoder decodes as v1 (test a_v1_tape_from_the_old_encoder_still_decodes)
        deps: [E01-S02]
        ac:
          - Correction and cancel-error events modelled (Alpaca corrections/cancelErrors)
          - NewsEvent with arrival timestamp for point-in-time use
          - Encoding carries a schema version; old tapes still decode
      - id: E01-S08
        jira: TIC-23
        title: ADR process and contributor docs
        status: done
        evidence: docs/adr/ (template, index, ADRs 0001-0004); README workflow section
        ac:
          - docs/adr/ with a template and the first ADRs (language, no Redis on hot path, determinism rules)
          - README workflow section matches how Jira keys are used in branches and commits

  - id: E02
    jira: TIC-3
    title: Provider abstraction and synthetic provider
    phase: 1
    labels: [phase1, synth, providers]
    goal: A test provider modelled closely on Databento and Alpaca, deterministic enough to build and verify everything else against.
    stories:
      - id: E02-S01
        jira: TIC-24
        title: Provider trait, capabilities and vendor-shaped error model
        status: done
        evidence: crates/tf-provider/src/lib.rs
        ac:
          - Synchronous pull-based poll contract; no async runtime in engine-facing code
          - Capabilities express connection cap, symbol cap, wildcard, replay window and wire format
          - Errors mirror Alpaca 405/406 semantics
      - id: E02-S02
        jira: TIC-25
        title: Deterministic synthetic generator with runner scenarios
        status: done
        evidence: crates/tf-synth/src/{symbol_gen,scenario,stream}.rs; golden hash test
        ac:
          - Same seed and config give a byte-identical stream (golden hash pinned)
          - Integer-only maths and an in-crate PRNG, no dependence on rand or libm
          - Healthy-pullback and dangerous-pullback runner shapes asserted by tests
      - id: E02-S03
        jira: TIC-26
        title: Fault injection (drops, duplicates, reordering, connection and symbol limits, replay)
        status: done
        evidence: crates/tf-synth/src/provider.rs; tests in tests.rs and crates/tf-replay/tests
        ac:
          - Shared Account enforces the concurrent-connection limit across provider instances
          - Reconnect with replay re-delivers from a timestamp with identical seqs (one boundary duplicate)
          - Reconnect without replay loses exactly the outage
      - id: E02-S04
        jira: TIC-27
        title: Scenario library v2 (halt-up, LULD, SSR, squeeze, gap-and-go, multi-spike)
        status: done
        evidence: crates/tf-synth/src/{scenario,symbol_gen}.rs; a behavior test and a golden_stream_hash_<name> test per scenario in tests.rs (goldens also run on aarch64)
        deps: [E01-S02]
        ac:
          - Each scenario emits the matching Status events and price/volume behaviour
          - Multi-spike scenario exercises Strategy 1 re-arm logic
          - Squeeze scenario produces a gap that defeats a naive stop
          - Golden hashes added per scenario
      - id: E02-S05
        jira: TIC-28
        title: Calibrate synthetic realism against real tape
        status: todo
        deps: [E06-S01]
        ac:
          - Burstier arrivals, U-shaped intraday volume and realistic spread/size distributions fitted to Databento historical data
          - Calibration is a documented, reproducible script
          - Synthetic message rates reach realistic open-bell peaks
      - id: E02-S06
        jira: TIC-29
        title: Synthetic news and sentiment events correlated with scenarios
        status: done
        evidence: crates/tf-synth/src/{config,stream,scenario}.rs; lead/lag, clamp, determinism and golden_stream_hash_news tests in tests.rs
        deps: [E01-S07]
        ac:
          - Headline events precede or follow price scenarios with configurable lead and lag
          - Deterministic under seed
      - id: E02-S07
        jira: TIC-30
        title: Synthetic provider as a WebSocket server
        status: todo
        ac:
          - Serves the Alpaca-style JSON/msgpack protocol with auth, subscribe and 405/406 errors
          - Lets ingestor networking, reconnect and backpressure code paths be tested end to end
          - Deployable as a pod for cluster integration tests
      - id: E02-S08
        jira: TIC-31
        title: Wire-format emulation and parse-cost realism
        status: todo
        deps: [E02-S07]
        ac:
          - JSON and msgpack framing selectable per run
          - Benchmark shows ingest cost with realistic message sizes

  - id: E03
    jira: TIC-4
    title: Deterministic run loop and replay
    phase: 1
    labels: [phase1, replay]
    goal: A run is a pure function of (provider, subscription, sink, config), so live, replay and backtest share one code path and runs parallelise freely.
    stories:
      - id: E03-S01
        jira: TIC-32
        title: run() loop on a simulated clock with reconnect and resume
        status: done
        evidence: crates/tf-replay/src/lib.rs
        ac:
          - Drives any Provider to exhaustion, advancing SimClock to each ts_recv
          - Reconnects up to a limit, resuming from the last ts_recv; reports Stalled and TooManyReconnects
      - id: E03-S02
        jira: TIC-33
        title: Sinks (hash, stats, dedupe, vec, tee)
        status: done
        evidence: crates/tf-replay/src/sinks.rs; crates/tf-replay/tests/determinism.rs
        ac:
          - Identical runs give identical hashes
          - A run that drops, replays and dedupes matches the clean run exactly
      - id: E03-S03
        jira: TIC-34
        title: Run manifest and results schema
        status: done
        evidence: crates/tf-manifest/ (Manifest, RunResult, DirStore, in-crate SHA-256); canonical encoding pinned and cross-checked in Python; `tf synth --store`; docs/adr/0009
        ac:
          - Manifest records git sha, config, seed, params hash and data range
          - Results written as a stable schema, keyed by the manifest hash for dedupe of reruns
      - id: E03-S04
        jira: TIC-35
        title: Tape replay driver (1x to Nx) as a Provider
        status: done
        evidence: crates/tf-tape/src/replay.rs (TapeProvider, Speed, Pacer); pacing, filtering, reconnect and damaged-tape tests in replay_tests.rs; docs/adr/0007-paced-replay-waits-inside-poll.md
        deps: [E04-S01]
        ac:
          - Reads a tape file through the same Provider trait
          - Speed control with injected clock; as-fast-as-possible mode for backtests
      - id: E03-S05
        jira: TIC-36
        title: Throughput and tail-latency benchmark harness
        status: done
        evidence: crates/tf-bench/ and `tf bench` (four scenarios, two-pass timing, JSON-lines results with --compare); .github/workflows/bench.yml uploads results per commit and diffs against main; docs/adr/0008
        ac:
          - Benchmarks events/s and per-event p50/p99/p99.9 through the run loop with a realistic sink
          - Results tracked per commit so regressions are visible
      - id: E03-S06
        jira: TIC-37
        title: Cross-platform determinism gate
        status: done
        evidence: .github/workflows/ci.yml (job `determinism`, x86_64 + aarch64); `determinism (x86_64)` and `determinism (aarch64)` are required statuses on main
        deps: [E01-S05]
        ac:
          - CI runs the golden-hash tests on x86_64 and aarch64 Linux
          - Any hash drift fails the build

  - id: E04
