name: Image

# The container image of the tickforge command line (Dockerfile), published to GitHub's registry so the homelab cluster can pull it.
# Every push to main is tagged with its commit and `main`; a pull request's branch is tagged with its commit only, so a change can
# be tried on the cluster before it is merged. Nothing here is a required check.

on:
  push:
    branches: [main]
  pull_request:
    paths: [Dockerfile, .dockerignore, scripts/**, crates/**, Cargo.toml, Cargo.lock, rust-toolchain.toml, .github/workflows/image.yml]
  workflow_dispatch:

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    # A pull request from a fork has no token that can write packages.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: tags
        run: |
          sha="${{ github.event.pull_request.head.sha || github.sha }}"
          t="ghcr.io/gavinmce/tickforge:${sha}"
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then t="$t,ghcr.io/gavinmce/tickforge:main"; fi
          echo "tags=$t" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
