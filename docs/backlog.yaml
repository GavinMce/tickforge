      - id: E18-S05
        jira: TIC-144
        title: Multi-strategy live host with sub-accounts, simulated broker and staged rollout
        status: done
        deps: [E18-S03, E18-S04, E09-S08]
        evidence: >
          New crate tf-host (ADR 0046). One engine step per event serves up to 20 strategies: brokers
          see the event and what they did is recorded in the ledger and told to the owning strategy;
