          flattened are pushed on. Failure isolation: a strategy that panics (in a review, an order
          update or a revocation), is killed, or crosses a loss limit stops alone; its working opens are
          cancelled and what it holds is closed by the host through the same gateway (marketable
          collars, own numbering, repeated each second until flat, shown against a rate limit that
          refuses some closes); the other strategy's decisions and counts are identical with and
          without the broken one. Soft limit: stops events and reviews, cancels resting opens, keeps the
          position; hard limit: flattens. Kill switch: gateway refuses opens, host cancels what is
          working to open. Admission: `certify` replays a strategy, as configured, over a tape through a
