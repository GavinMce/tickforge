          other-universe certificate and one from too short a replay, and `certify` refuses a
          strategy that panics, is stopped by a limit, has no budget, needs data the snapshot lacks
          or names symbols the host does not know. Tier 1 holds are derived from the ledger (a position
          or any working order, including one whose placement got no answer) and given to the
          promoter per strategy; interests lost to an eviction reach the strategy that held them. Broker
