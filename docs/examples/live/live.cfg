live config v1
# The Standard plan streams EQUS.MINI: consolidated top of book, with no `status` schema (halts, limit-up/limit-down are not seen)
# and no trades-with-consolidated-quote schema. `tbbo` is each trade with the best bid and offer at that moment, about eight million
# records a day; `mbp-1` (every change of the top of book) is about forty times that and not needed by the first strategies.
dataset EQUS.MINI
subscribe tbbo ALL_SYMBOLS
key_env DATABENTO_API_KEY
set month.set
snapshots snapshots
certificates certificates.txt
dir run
# Start the engine before four in the morning New York time, or ask the gateway to replay from the premarket:
# replay_from_premarket yes
# The day ends at 20:00 (after-hours close). `end close` ends it at 16:00.
# end close
