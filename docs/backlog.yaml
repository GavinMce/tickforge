          by the cool-down sweep and leave it a cool-down after the last interest is released. Eviction
          and promotion are TierChange events (new reasons STRATEGY_REQUEST, EVICTED) for the tape, a
          follower applies them and ends in the same membership (tested), and a follower refuses to decide.
