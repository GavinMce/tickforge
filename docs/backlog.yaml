      - id: E18-S03
        jira: TIC-142
        title: Cross-sectional strategy interface (periodic callback on a member view)
        status: done
        deps: [E18-S01]
        evidence: >
          tf-strategy::cross (ADR 0043). CrossStrategy: `on_review(ctx, view)` once per period of event
          time, optional `on_member_event` (only when WANTS_MEMBER_EVENTS, and only for member symbols),
          `on_timer`, `on_order_update`; the same Ctx as other strategies (intents validated, stamped
          and numbered per strategy). MemberView is read-only: member ids ascending, state/feature of
          members only (a non-member reads as None), and top_k / top_by: best k by any key or by a
          LiveFeature, ties to the lower id, one pass and room for k entries; checked against sorting
          everything on 300 random symbols with many ties, k from 0 to beyond the member count, both
          directions. Members is a bitset over dense instrument ids (insert/remove/apply a selector's
          Change/from a stored Selection, reporting names the table does not know). CrossRunner owns no
          market state: the engine owns one Tier 0 and passes it to every runner (Market), so 20
          strategies cost one Tier 0 update per event. Reviews fall on a grid of event time (first
          event at or after each multiple of the period; a long gap gives one review, not a burst), so
          a replay reviews at the same instants, shown by running the same events twice. 15 tests;
          ~25 mutants of the bitset, ranking order and ties, grid, routing, wake-up and view visibility
          all killed. Benchmark (tf-bench example cross_load, this machine, release): 20 strategies x
          5,000 symbols, every strategy watching every symbol, 300,000 trades/s: Tier 0 alone 21 ns/event
          (0.65% of a core at market speed); with the 20 strategies 55-58 ns/event (1.7%); the strategies
          add about 33 ns/event of routing (a wake-time compare per strategy) plus about 31 us per review
          of 5,000 members (20 reviews a second), about 1.0% of one core at the opening burst rate.
          Narrowed: "no measurable load" is not met in ratio (the strategies cost 1.6x Tier 0 itself per
          event); what is shown is the absolute cost, about 1% of a core at the heaviest rate measured.
          A host that tests one shared wake-up time before touching any runner would remove most of the
          routing; that belongs to the multi-strategy host (E18-S05). Not here: Tier 1 pinning by cross
          strategies (E18-S04), the host that wires selectors, runners, gateway and broker (E18-S05).
        ac:
          - A strategy that watches many symbols gets a periodic callback with a read-only view of its member symbols and helpers to rank the top K by a feature, instead of one callback per event
          - Membership is a per-strategy bitset over dense instrument ids; member events reach only strategies that include the symbol and ask for them
          - 20 strategies over 5,000 symbols at one callback a second add about 1% of one core at 300,000 trades/s, measured by a benchmark (a share of Tier 0's own cost is reported, not hidden)
      - id: E18-S04
        jira: TIC-143
        title: "Shared Tier 1 capacity: refcounted pins, priority, denial counters"
        status: done
        deps: [E18-S03]
        evidence: >
          tf-engine claims (ADR 0044). Holds (`pin`) are now counted per strategy (the old single flag
          let one strategy's unpin release another's; tests show both strategies pinning one symbol and
          one letting go leave it pinned). A symbol with any hold is never demoted by the sweep nor
          evicted. `request` asks for a symbol to be in Tier 1: already there (interest recorded),
          promoted when there is room, or promoted by evicting under one written rule: candidates are the
          promoted symbols nobody holds that have dwelt the minimum; each has a level (0 if only the
          scanner wanted it, else the highest priority of the interested strategies); a request may evict
          only a level strictly below its priority; the victim is the lowest level, then fewest
          interested, then longest since hot, then lowest id (each tie-break has a test that fails if the
          order is swapped). Equal priorities never evict each other. Interested symbols are not demoted
          by the cool-down sweep and leave it a cool-down after the last interest is released. Eviction
          and promotion are TierChange events (new reasons STRATEGY_REQUEST, EVICTED) for the tape, a
          follower applies them and ends in the same membership (tested), and a follower refuses to decide.
          Every outcome is counted per strategy (requests, already, promoted, evicted_for, denied_full,
          denied_other, lost) and exported as `tier1_*{strategy="N"}` lines by Promoter::metrics_text;
          interests lost to an eviction are listed by drain_revoked and reach the strategy through
          CrossRunner::on_tier1_revoked. Ctx gained request_tier1/release_tier1/wants_tier1; pin_tier1
          and unpin_tier1 are per strategy. 11 new engine tests and 3 strategy tests; 27 mutants of the
          rule, tie-breaks, dwell, holds, sweep, revocation, follower and counters killed (two equivalent
          ones left: a guard in set_hold, and an interest filter I removed as dead code). Narrowed: a
          hold exists when a strategy pins; the momentum strategy already pins while it has a position or
          working order, and the multi-strategy host (E18-S05) is where holds will also be derived from
          the gateway's order and position state for cross strategies. Known limit: in a replay the
          follower applies a strategy-caused eviction before the event that caused it, live applies it
          inside that event's callback, so a strategy that looks at the evicted symbol after requesting,
          in the same callback, can see different state; E18-S06 (replay equivalence) is to probe it.
        ac:
          - A symbol stays in Tier 1 while any strategy holds or wants it; the Tier 1 cap is shared with a documented priority rule when strategies compete
          - A request that cannot be granted is counted per strategy and exported as a metric, never silently lost
          - Demotion and eviction never take a symbol a strategy holds (pins for a position or working order); deriving holds from the gateway is E18-S05
      - id: E18-S05
        jira: TIC-144
        title: Multi-strategy live host with sub-accounts, simulated broker and staged rollout
        status: done
        deps: [E18-S03, E18-S04, E09-S08]
        evidence: >
          New crate tf-host (ADR 0046). One engine step per event serves up to 20 strategies: brokers
          see the event and what they did is recorded in the ledger and told to the owning strategy;
          marks; shared Tier 0 and promoter; every running strategy (reviews, member events) and each
          dynamic universe; then each strategy's intents go through the risk gateway (kill switch, loss
          limits, per-strategy budgets from the budget tree: its sub-account, refused at admission if it
          has none), into the ledger, and to the strategy's broker (the simulated one, or a paper
          broker the host is given); once a second of event time the loss limits are checked and strategies being
          flattened are pushed on. Failure isolation: a strategy that panics (in a review, an order
          update or a revocation), is killed, or crosses a loss limit stops alone; its working opens are
          cancelled and what it holds is closed by the host through the same gateway (marketable
          collars, own numbering, repeated each second until flat, shown against a rate limit that
          refuses some closes); the other strategy's decisions and counts are identical with and
          without the broken one. Soft limit: stops events and reviews, cancels resting opens, keeps the
          position; hard limit: flattens. Kill switch: gateway refuses opens, host cancels what is
          working to open. Admission: `certify` replays a strategy, as configured, over a tape through a
          scratch host with the same limits and budgets and issues a sealed Certificate (strategy
          fingerprint over number, name, parameters, universe, priority and route; tape id; counts; an
          outcome hash); `add_strategy` refuses a missing, altered, other-strategy, other-parameters or
          other-universe certificate and one from too short a replay, and `certify` refuses a
          strategy that panics, is stopped by a limit, has no budget, needs data the snapshot lacks
          or names symbols the host does not know. Tier 1 holds are derived from the ledger (a position
          or any working order, including one whose placement got no answer) and given to the
          promoter per strategy; interests lost to an eviction reach the strategy that held them. Broker
          faults are handled per order (refused and rate-limited orders are closed in the ledger, unanswered ones stay
          working and held); a broker that says impossible things is counted and noted, never forced
          into the ledger. 20 tests including 20 strategies in one engine (each position its own; their sum is the
          broker's) and two identical runs giving identical ledgers; about 35 mutants killed (one equivalent: a
          `.max(1)` on the minimum events). Narrowed: "a subset can send orders to Alpaca paper" is
          split out as E18-S11 (TIC-152; needs the transport, E09-S10, and credentials): the host routes
          to any Broker and the Alpaca one is tested against a fake transport only. The certificate's
          replay takes the tape as events with a tape id; reading a capture directory into those events and
          proving a replay equals the live run is E18-S06. A certificate proves the strategy ran through
          this machinery without a panic or ledger refusal; it is not a claim about profit.
        ac:
          - 10 to 20 strategies run in one engine, each with its own budget (a sub-account of the gateway) against the simulated broker on live data
          - A strategy can be added only with a certificate that it was replayed on a tape, and the host refuses one that has not
          - One strategy failing or being killed does not stop the others, and the kill switch and loss limits behave as in the single-strategy case
