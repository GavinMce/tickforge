        ac:
          - A command turns Databento daily bars into per-symbol reference rows (last close, average dollar volume, ATR) for the universe filter, with the as-of date stored; run by one script and one command
          - Tradable, shortable and easy-to-borrow flags are read from the Alpaca assets format (fixtures; the real endpoint is E18-S10); float and short interest are explicitly absent (E14) and filters that need them refuse to run
          - Point-in-time: bars dated after the as-of date are never read, and a symbol with no bar on the as-of day has no price
