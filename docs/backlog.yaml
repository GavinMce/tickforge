  - id: E03
    jira: TIC-4
    title: Deterministic run loop and replay
    phase: 1
    labels: [phase1, replay]
    goal: A run is a pure function of (provider, subscription, sink, config), so live, replay and backtest share one code path and runs parallelise freely.
    stories:
      - id: E03-S01
        jira: TIC-32
        title: run() loop on a simulated clock with reconnect and resume
        status: done
        evidence: crates/tf-replay/src/lib.rs
        ac:
          - Drives any Provider to exhaustion, advancing SimClock to each ts_recv
          - Reconnects up to a limit, resuming from the last ts_recv; reports Stalled and TooManyReconnects
      - id: E03-S02
        jira: TIC-33
        title: Sinks (hash, stats, dedupe, vec, tee)
        status: done
        evidence: crates/tf-replay/src/sinks.rs; crates/tf-replay/tests/determinism.rs
        ac:
          - Identical runs give identical hashes
          - A run that drops, replays and dedupes matches the clean run exactly
      - id: E03-S03
        jira: TIC-34
        title: Run manifest and results schema
        status: done
        evidence: crates/tf-manifest/ (Manifest, RunResult, DirStore, in-crate SHA-256); canonical encoding pinned and cross-checked in Python; `tf synth --store`; docs/adr/0009
        ac:
          - Manifest records git sha, config, seed, params hash and data range
          - Results written as a stable schema, keyed by the manifest hash for dedupe of reruns
      - id: E03-S04
        jira: TIC-35
        title: Tape replay driver (1x to Nx) as a Provider
        status: done
        evidence: crates/tf-tape/src/replay.rs (TapeProvider, Speed, Pacer); pacing, filtering, reconnect and damaged-tape tests in replay_tests.rs; docs/adr/0007-paced-replay-waits-inside-poll.md
        deps: [E04-S01]
