[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "UNLICENSED"
publish = false

[workspace.dependencies]
tf-core = { path = "crates/tf-core" }
tf-provider = { path = "crates/tf-provider" }
tf-synth = { path = "crates/tf-synth" }
tf-replay = { path = "crates/tf-replay" }
tf-secmaster = { path = "crates/tf-secmaster" }
tf-tape = { path = "crates/tf-tape" }
tf-engine = { path = "crates/tf-engine" }
tf-bench = { path = "crates/tf-bench" }
tf-manifest = { path = "crates/tf-manifest" }
tf-strategy = { path = "crates/tf-strategy" }
tf-risk = { path = "crates/tf-risk" }
tf-params = { path = "crates/tf-params" }
tf-backtest = { path = "crates/tf-backtest" }
tf-ledger = { path = "crates/tf-ledger" }

[workspace.lints.rust]
unsafe_code = "forbid"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
lto = "thin"
codegen-units = 1
