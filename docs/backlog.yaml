      - id: E05-S05
        jira: TIC-48
        title: Backpressure and drop policy
        status: done
        evidence: "crates/tf-ingest: one bounded ring between a feed thread and the engine thread; push never blocks (queued / conflated / dropped), admission by worth (quotes below half the ring, then conflated per symbol and queued when it drains; trades up to 90%, then dropped; control events up to full), every drop counted by kind and marked in-band by a Gap (kind, count, first and last time) before the next event, per-symbol order kept, no unsafe and no new dependency, counters shared by both ends (exporting them is E13-S03); ADR 0039. 19 tests incl. a 60-seed property (per-symbol order, every trade delivered or counted with markers adding up exactly, the last quote per symbol delivered), a producer/consumer thread test, a bounded-bookkeeping test under sustained pressure; about 40 mutations tried, the two real gaps (a leaking dirty list, shared gap slots) closed. Real data, tf-ingest example `burst` (local; XNAS.BASIC trades 2026-10-02 09:30:00-09:35:00 ET at their recorded spacing into Tier 0): no trade dropped with no stall, nor with the engine paused for 1, 3 or 6 seconds in the middle of the burst (deepest ring 343k of 2.1M); the busiest second is 236,131 trades (304,321 with zero-share prints); queue latency p50 0.2 us, p99 38 us, p99.9 28 ms and max 35 ms (the tail is this machine's scheduler, with no stall). Drops start only with a ring smaller than the burst, and then add up exactly: a 200k ring paused 3 s offered 531,057 = 408,784 delivered + 122,273 in 30 markers. Not done: the ingestor that feeds it (E05-S02), exporting the counters (E13-S03), a quote workload on real data (only synthetic quotes are tested)"
        deps: []
        ac:
          - Bounded SPSC queue between feed and engine; feed is never blocked
          - Drops are counted, available as a counter snapshot for the metrics exporter (E13-S03), and the policy is documented
          - Survives a replay of the real opening five minutes of 2026-10-02 with no trade dropped; under pressure quotes are conflated, never trades
  - id: E06
    jira: TIC-7
    title: Databento integration
    phase: 2
    labels: [phase0, phase2, databento]
    goal: Real market data in, measured and captured.
    stories:
      - id: E06-S01
        jira: TIC-49
        title: "Phase 0: measure real message rates and symbol skew"
        status: todo
        ac:
          - Pull one day of Databento historical data for the target universe
          - Report per-second peak and sustained rates, per-symbol skew, trades vs quotes
          - Decide whether Tier 0 can afford quotes; resize hot-state estimates
      - id: E06-S02
        jira: TIC-50
        title: Databento live adapter (own synchronous client, no async runtime)
        status: done
        deps: [E01-S06, E05-S02]
        evidence: >
          New crate tf-live (ADR 0049): the gateway's text protocol (greeting, CRAM login as SHA-256 of
          `challenge|key` with the key's last five characters as the bucket, subscription lines of up to 500
          symbols with `is_last` only on the final one, `start_session`), a login/subscribe/start session
          over a plain TcpStream with timeouts, one reader thread that decodes the stream with tf-databento
          and offers every event to the ingest queue (which never blocks it), and `LiveProvider`
          behind `Provider`: connect, subscribe (a filter), poll, disconnect, reconnect with a resume time
          (every subscription is replayed from it) that keeps instrument ids across sessions. Prices are the
          wire's, to the billionth (an exact-price check). Gateway skip notices become a new `Skipped`
          gap marker in the ingest queue, in order with the events; heartbeats keep a session alive past the
          stall time and silence past it is reported as a stalled session; an engine that never reads
          cannot block the feed (200,000 trades into a queue of 64: all accounted for). SHA-256 is
          written here (60 lines) and checked against the standard's vectors and every padding boundary.
          15 tests against a fake gateway written from the official client's behaviour; ~30 mutants of the
          login line, symbol chunking, resume, stall, filter, names and instrument numbering killed.
          Against the REAL gateway (examples/probe, no data asked for): its greeting (`lsg_version=0.9.4`)
          and challenge were read, and the login line was accepted well enough that it answered "A live data
          license is required to access XNAS.BASIC": so the greeting, challenge and login format are
          confirmed, and everything after login (subscription lines, the stream, heartbeats, intraday
          replay) is tested only against the fake until the plan is bought. Narrowed: "same provider
          conformance tests as the synthetic provider" is met by testing the same contract (not connected
          before connect, wildcard, subscription filter, idempotent connect, disconnect releases, reconnect)
          rather than by a shared harness; the official `databento` crate was not used (it brings tokio).
        ac:
          - Maps trades, top-of-book and status records to canonical events with zero rounding on prices
          - Keeps the contract the synthetic provider keeps (connect, subscribe, poll, reconnect, disconnect)
          - Logs in to the real gateway as far as the plan allows, and says exactly what was and was not checked
      - id: E18-S12
        jira: TIC-153
        title: "Live day driver: feed, ingest queue, host, capture and decision log wired together"
        status: done
        deps: [E06-S02, E06-S04, E18-S05, E18-S06, E18-S07]
        evidence: >
          tf-driver (ADR 0050): `run(config, strategies-with-certificates, ledger store, stop flag)` runs a day from
          the first instrument name to the close. Warm-up: logs in, waits until the gateway has been quiet about
          instrument names (or a limit), builds the symbol table from them, builds the host and admits the
          strategies, whose universes are resolved against those names (events wait in the queue). The raw
          capture is written by the feed thread from the bytes as read (a new Decoder tap and a RawSink in tf-live);
          if it cannot be written the day stops with the kill switch thrown. The decision log is appended to a
          file as the day goes and closed at the end (a log cut by a crash reads back as far as it goes,
          `Log::parse_partial`). Events the gateway sent twice after a reconnect are dropped by one rule
          (tf_core::Dedupe, exact repeats within one receive time) that the replay of the capture applies too;
          the replay stops at the live day's end-of-day, so events a capture holds beyond the close are not
          replayed. A dropped or silent session is reopened from the last event's time with backoff; one that
          stays down ends the day with "THE GATEWAY WAS LOST" and a list of the positions left open. The engine's
          time per event is measured with the wall clock (the host cannot) and goes, with the queue's counters and
          the capture's size, into the daily report; the capture is finished, verified and (if asked) replayed
          through a fresh host, with the comparison in the report. Gateway skip notices become gaps on the host and
          in the report. 7 driver tests against a fake gateway: a whole day (names, universes, 800 and 400 shares
          held, log equal to the host's, capture clean, replay equal, report with the driver's measurements), a
          forced disconnect (same decisions as the uninterrupted day, `start=` the last event's time, one repeat
          dropped, replay of the capture still equal), a gateway that does not return, a capture that cannot be written, an
          operator's stop (everything queued is taken first), a skip notice, and a strategy whose
          certificate is for another; 11 mutants of dedupe, resume, close time, tail, capture failure,
          reconnect limit, gaps, log close, the replay and lag killed. Not done, and said so: it has not run
          against the real feed (needs the plan): the subscription lines, stream and heartbeats were
          confirmed only against the fake; no real process scheduling (the 04:00 start, a signal handler for
          the stop flag, the ledger on disk) which is E18-S09; no strategies yet (E18-S08).
        ac:
          - One driver loop runs a day from the first instrument name to the close, against a fake gateway, with the capture replayed through the same host to the same decisions
          - A forced disconnect resumes from the last event time with no loss and no double delivery, and the day is the same as without it
          - The daily report is produced with the driver's own measurements; a gateway that stays down, a capture that cannot be written and an operator's stop each end the day honestly
      - id: E06-S03
        jira: TIC-51
        title: Session management with intraday replay and symbol sharding
        status: todo
        deps: [E06-S02]
        ac:
          - Reconnect resumes with a start timestamp; no loss across a forced disconnect
          - Universe changes mid-session handled by a new session where replay is needed
          - Shards symbols across sessions within the plan limit
      - id: E06-S04
        jira: TIC-52
        title: Raw DBN capture to rolling, crash-safe files, replayable through the Provider interface
        status: done
        evidence: "crates/tf-capture: RawWriter writes the provider's own DBN records byte for byte to rolling raw-<first ts_recv>-<n>.dbn.zst segments (every 900 s of receive time; zstd with frame checksums) via NAME.part, sync() (flush to a decodable point + fsync, about once a second) and close (finish, fsync, rename, fsync the directory); opening a capture repairs it (a .part is read as far as it decodes and rewritten as a clean segment marked recovered; a finished segment the manifest lost is listed as late); append-only manifest.tfcap with records, first/last ts_recv, bytes and checksum per segment; verify() finds a missing, stray, unfinished, resized, corrupted, recounted or re-timed segment; CaptureReplay is a tf_provider::Provider (subscription filter, paging, End, ids carried across segments); to_tape() writes the normalized tf-tape; `tf-databento` gained the reusable Mapper so the live adapter maps the records it captures. ADR 0040. 14 tests incl. an unfinished file cut at every one of its last 300 bytes and every 37th before (always a clean prefix, never fewer records for more bytes); about 45 mutations tried, the real gaps closed. Real data (local): 788,740 records (a midday trade window, a premarket quote window, a day of status) written at 1.1M records/s including an fsync per 100k, 16.4 MB on disk for 18.2 MB of input, verified clean, replay equal event for event to decoding the files directly. NOT done: shipping segments to MinIO (E06-S08) and the live feed that calls it (E06-S02); a capture is of what the feed delivered, not of what the engine was handed under pressure (ADR 0039/0040)"
        deps: [E06-S07]
        ac:
          - The provider-native records of a session are stored exactly, in files that are complete or recoverable after a crash, with a manifest that can be checked
          - A capture replays through the Provider interface and converts to the normalized tape, which the tape driver replays at any pace
      - id: E06-S08
        jira: TIC-150
        title: Ship finished raw capture segments to MinIO and keep them verified
        status: todo
        deps: [E06-S04, E04-S03]
        ac:
          - Finished segments of a raw capture (manifest-listed, never a .part) are copied to a MinIO bucket by date, with the manifest line and checksum, and a second verify pass compares the stored object with the manifest
          - A failed or partial upload is retried and never removes the local copy; local segments are deleted only after the stored copy is verified and a retention period has passed
          - The upload runs off the feed path: capturing never waits on the network
      - id: E06-S05
        jira: TIC-53
        title: Symbology mapping and daily instrument definitions
        status: todo
        deps: [E01-S06, E06-S02]
        ac:
          - instrument_id to symbol mapping kept current intraday
      - id: E06-S06
        jira: TIC-54
        title: Halt, LULD and status handling
        status: done
        evidence: >
          Halts, pauses and short-sale-restriction changes surface as Status events: the DBN decoder of
          E06-S07 maps a halt, pause or suspend to TradingHalt, a return to trading to TradingResume and an
          SSR change to ShortSaleRestriction, keeping the feed's own event time (crates/tf-databento, tests
          with synthetic DBN; a real day of status decodes with ts_recv never going backwards, 48 halts or
          pauses, 13,337 trading and 308 SSR records). Checked again on 2026-10-02 for the whole market: 34
          of the 48 are LULD pauses (reason 50), 25 of 5 minutes, 7 of about 10, one of 15 and one of 25.
          Narrowed: the LULD bands are not in XNAS.BASIC (its statistics schema holds only the opening and
          closing prices, seen for AAPL, TSLA and SPY on that day), so they cannot surface from the feed;
          computing them from the Plan's rules, and carrying the halt reason (an LULD pause against a news
          halt) in the Status event, are E19-S09 (TIC-163). The restricted flag on every status record is
