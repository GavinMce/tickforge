live config v1
# EQUS.MINI is what the Standard plan streams (consolidated top of book). tcbbo is each trade with the best bid and offer
# at that moment; status carries halts and limit-up/limit-down. cmbp-1 (every change of the top of book) is about ten times
# the data and is not needed by the first strategies.
dataset EQUS.MINI
subscribe tcbbo ALL_SYMBOLS
subscribe status ALL_SYMBOLS
key_env DATABENTO_API_KEY
set month.set
snapshots snapshots
certificates certificates.txt
dir run
# Start the engine before four in the morning New York time, or ask the gateway to replay from the premarket:
# replay_from_premarket yes
# The day ends at 20:00 (after-hours close). `end close` ends it at 16:00.
# end close
