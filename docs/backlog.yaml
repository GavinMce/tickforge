        deps: [E01-S04]
        ac:
          - Length-prefixed encoded events, zstd-compressed blocks, footer index, versioned header
          - 10M synthetic events round-trip bit-exactly
          - Seek by ts_recv in O(log n)
      - id: E04-S02
        jira: TIC-39
        title: Parquet writer partitioned by date, schema and symbol bucket
        status: todo
        deps: [E01-S02]
        ac:
          - Row groups sized for DuckDB scans; zstd
          - Prices stored as integers with the scale in metadata
      - id: E04-S03
        jira: TIC-40
        title: MinIO deployment, buckets and lifecycle rules
        status: todo
        ac:
          - Buckets for tapes, parquet and results; retention policy per bucket
          - Credentials via SOPS-managed secrets
      - id: E04-S04
        jira: TIC-41
        title: Archiver service consuming JetStream
        status: todo
        deps: [E04-S01, E04-S02, E05-S01]
        ac:
          - Consumer-group based; restarts resume without loss or duplicates
          - Flushes row groups every few minutes; engine is never blocked by it
      - id: E04-S05
        jira: TIC-42
        title: DuckDB query layer with agent-safe read-only views
        status: todo
        deps: [E04-S02]
        ac:
          - Documented sample queries (bars, volume by symbol, tick windows)
          - Read-only credentials and row/time limits for agent use
      - id: E04-S06
        jira: TIC-43
        title: Nightly compaction CronJob and retention
        status: todo
        deps: [E04-S02, E04-S03]
        ac:
          - Small files merged per partition; idempotent and safe to rerun
          - Retention enforced and logged

