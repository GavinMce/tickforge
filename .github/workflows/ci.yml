name: CI

on:
  pull_request:
  push:
    branches: [main]

# A newer push to the same PR/branch makes the older run pointless.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: 1

jobs:
  # The job id is the status-check name branch protection requires. Renaming it
  # silently un-requires the check, so change both together.
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      # Installs what rust-toolchain.toml asks for (channel and components), so
      # CI and `task check` use the same toolchain.
      - name: Install toolchain
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@v2

      # Same three steps as `task check` (Taskfile.yml: lint, then test).
      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace
