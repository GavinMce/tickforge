          shortable, easy_to_borrow and exchange for the symbols it lists (an unlisted symbol stays
          unknown and fails conditions); an ETF list the person keeps adds etf; float and short interest
          are absent so universes using them refuse (shown end to end in a CLI test). 8 library tests and
          1 CLI test; 20 mutants of the window, minimum days, as-of rule, true range terms, session lookup,
          filters and flag copying all killed (one equivalent mutant, |l-pc| written as |pc-l|). Real data
          (Databento EQUS.SUMMARY ohlcv-1d, 2026-09-01 to 2026-10-02, 304,704 bars, about $0.48 of credit):
          13,252 symbols as of 2026-10-02 in 0.17 s; price, adv_dollar, adv_shares and atr_permille for
          AAPL, NVDA, TSLA, F and SPY agree exactly with an independent recomputation from the raw CSV.
          Narrowed: the Alpaca assets parser is tested on fixtures in the documented format and has not run
          against the real endpoint (no credentials), now E18-S10; "gap" is a live measure (E18-S01), not a
          reference column; the daily schedule is operations (E18-S09), here it is one script and one
          command; 145 symbols with non-name characters (warrants, rights, some preferreds) cannot be
          listed and are counted; the dollar volume uses each day's close, not its VWAP; etf has no free
