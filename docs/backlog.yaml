        status: done
        evidence: crates/tf-engine/src/indicators.rs (Sma, Ema, Extremes, RateOfChange, Vwap, RollingVwap, Rsi, Atr, OpeningRange); EMA/RSI/ATR match exact-fraction Python vectors (tests/gen_indicator_vectors.py); others match brute-force references; saturation test; pinned digest over a synthetic session; 21 mutations caught (two gaps found and closed); ADR 0018
