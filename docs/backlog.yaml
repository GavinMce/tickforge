      - id: E05-S04
        jira: TIC-47
        title: Bounded dedupe window and gap detection with gap-fill
        status: todo
        deps: [E05-S02]
        ac:
          - Dedupes on (provider, instrument, ts_event, seq) in bounded memory
          - Gaps detected and filled via provider replay or REST backfill
